provider: Google Looker Studio
providerId: google-looker-studio
deployment:
  mode: none
  auth: oauth
  verified: probed
  note: >-
    No MCP server is published for Looker Studio / Data Studio. Probed
    https://lookerstudio.google.com/mcp (HTTP 200, SPA catch-all HTML shell — not an MCP endpoint)
    and https://datastudio.googleapis.com/mcp (HTTP 400, Google API gateway error envelope);
    a JSON-RPC tools/list POST to the latter also returned 400.
disambiguation: >-
  Google DOES ship an MCP server for LOOKER — the Looker-managed MCP server and the Looker
  integration in the MCP Toolbox for Databases (https://docs.cloud.google.com/looker/docs/mcp).
  Looker and Looker Studio are DIFFERENT products: Looker is the LookML-modelled enterprise BI
  platform, Looker Studio (formerly, and again currently, Data Studio) is the self-service
  dashboard product whose API lives at datastudio.googleapis.com. The Looker MCP server does not
  expose Looker Studio assets and is NOT credited to this provider. It belongs to all/google-looker/.
