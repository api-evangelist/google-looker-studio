agent_notes:
- >-
  The API is only usable by members of a Google Workspace or Cloud Identity organization whose
  Workspace admin has granted the calling OAuth client domain-wide delegation. An agent acting for
  a consumer Google account cannot call it at all.
- >-
  Discovery is gated: https://datastudio.googleapis.com/$discovery/rest?version=v1 returns HTTP 403
  PERMISSION_DENIED to unregistered callers, and datastudio is not listed in the public
  https://www.googleapis.com/discovery/v1/apis directory (530 entries, checked 2026-09-12).
