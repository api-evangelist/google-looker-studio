aid: google-looker-studio
name: Google Looker Studio
description: >-
  Google Looker Studio — which Google's own documentation now renders again as Data Studio — is
  Google's self-service business intelligence and data visualization platform, free to build and
  view reports in, with a paid Pro tier sold per user per Google Cloud project. Three developer
  surfaces exist: a small REST management API at datastudio.googleapis.com for searching report and
  data-source assets and managing their sharing permissions, a Community Connector framework built
  on Google Apps Script, and a Community Visualization framework built on the @google/dscc browser
  library. The REST API is restricted to Google Workspace and Cloud Identity organizations and
  requires a Workspace admin to configure domain-wide delegation before any call succeeds.
