- aid: google-looker-studio:google-looker-studio-assets-search-api
  name: Google Looker Studio Assets:search API
  description: >-
    The REST management API for Looker Studio (Data Studio) assets. The contract captured in this
    repo covers one operation, assets:search, which lists the reports and data sources an
    authenticated Workspace user can see. Google documents four further operations on the
    Permissions resource that no machine-readable contract in this repo covers — recorded in
    overlays/google-looker-studio-assets-search-api-overlay.yaml. Access requires Google Workspace
    or Cloud Identity membership plus admin-configured domain-wide delegation.
