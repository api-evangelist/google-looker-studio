  the REST API and from the (nonexistent) REST SDK: they run inside the report canvas or inside the
  host page, not against datastudio.googleapis.com.
families:
- name: Community Visualizations
  kind: in-canvas component
  description: >-
    A custom chart authored as an HTML/JS bundle that Looker Studio loads into an iframe on the
    report canvas. The host passes data and style into the frame; the component renders and can
    send interactions back.
  loader:
