    Method names are recorded from the published package description and the visualization guide.
    The full surface is not re-listed here beyond what the provider documents.
  docs: https://developers.google.com/looker-studio/visualization
  tooling: cli/google-looker-studio-cli.yml
- name: Community Connectors
  kind: server-side extension (Google Apps Script)
  description: >-
    A connector authored in Apps Script that implements getConfig, getSchema, getData and
    getAuthType so an arbitrary data source appears in the Looker Studio connector picker.
  required_functions:
  - getAuthType
  - getConfig
  - getSchema
