method: searched
source: https://cloud.google.com/data-studio
created: '2026-05-04'
modified: '2026-09-12'
plan_count: 2
supersedes: >-
  REPLACED A FABRICATED SCAFFOLD. Until 2026-09-12 this file carried three invented tiers
  (Free / Professional / Enterprise) with invented quotas (1,000 and 100,000 requests per month),
  invented per-minute rates and TBD prices, written by the 2026-05-04 bulk sweep and never
  harvested. None of it corresponded to anything Google publishes. It is gone; every figure below
  is quoted from Google's own product page.
description: >-
  Looker Studio / Data Studio publishes exactly two commercial tiers on its own pricing table, and
  they are priced on SEATS AND PROJECTS, not on API consumption. There is no metered API pricing,
  no request quota attached to a price, and no overage rate — the REST API at
  datastudio.googleapis.com is included with the product at no additional charge and is gated by
  Google Workspace / Cloud Identity membership rather than by plan.
pricing_page: https://cloud.google.com/data-studio
pricing_page_status: 200
quote: >-
  "Pricing per user per month for Data Studio Pro varies depending on the length of the customer's
  subscription. Our self-service tier remains available at no cost."
plans:
- id: google-looker-studio-free
  name: Data Studio (self-service)
  type: free
  price: '0.00'
  currency: USD
  billing_period: none
  description: >-
    Self-service data visualizations and reports. Quoted from the provider pricing table as
    "No charge".
  included:
  - Create, share and view reports and data sources
  - Built-in and partner connectors
  - REST API access at datastudio.googleapis.com, subject to Google Workspace / Cloud Identity membership and domain-wide delegation
  api_quota: not published
  overage: not applicable
- id: google-looker-studio-pro
  name: Data Studio Pro (Project subscription)
  type: paid
  price: '9.00'
  currency: USD
  billing_period: month
  billing_unit: per user per Google Cloud project
  price_quote: '$9 per user per project per month'
  description: >-
    Quoted from the provider pricing table: "Department level reports and visualizations with
    Google Cloud support and system administration. Enterprise-Grade Security: Comprehensive
    support for advanced security controls, including Customer-Managed Encryption Keys (CMEK) for
    all assets developed within Data Studio."
  included:
  - Team workspaces and Pro content management
  - Google Cloud support
  - Customer-managed encryption keys (CMEK)
  - Customer-managed storage (own Cloud Storage bucket, own BigQuery dataset)
  - Data residency
  api_quota: not published
  overage: not applicable
  billing_notes:
  - Every Pro subscription is associated with one and only one Google Cloud project; the per-project billing unit means multi-project estates multiply the seat cost.
  - Billing is for the number of licences in the subscription regardless of whether they are used.
  - A 30-day no-cost trial is offered.
  - Looker (original) and Looker (Google Cloud core) customers receive complimentary Pro licences (at least 1,000, or matching their Looker licence count where higher).
  billing_notes_source: https://docs.cloud.google.com/looker/docs/studio/looker-studio-pro-subscription-overview
enterprise_tier: false
enterprise_note: >-
  No separate enterprise/contact-sales tier is published for this product. Volume and contractual
  terms are handled through the Google Cloud agreement that covers the project the Pro subscription
  is attached to.
